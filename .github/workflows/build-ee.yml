name: Build and Publish Ansible Execution Environment

on:
  release:
    types:
    - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ee-secrets-testing

jobs:
  build-and-push:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Ansible Builder
        run: pip install ansible-builder

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip v from release tag version
        run: |
          ORIGINAL_STR="${{ github.event.release.tag_name }}"
          STRIPPED_STR="${ORIGINAL_STR:1}"
          echo "IMAGE_VERSION=$STRIPPED_STR" >> $GITHUB_ENV

      - name: Build Execution Environment
        run: >-
          cd ee &&
          ansible-builder build
          --tag ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest
          --tag ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          --verbosity 2

      - name: Push Image to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}

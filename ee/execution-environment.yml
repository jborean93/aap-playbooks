version: 3

dependencies:
  ansible_core:
    package_pip: https://github.com/jborean93/ansible/archive/refs/heads/secrets-object.tar.gz
  ansible_runner:
    package_pip: ansible-runner
    # package_pip: https://github.com/jborean93/ansible-runner/archive/refs/heads/secret-masking.tar.gz
  galaxy:
    collections: []
  python: []
  # - pyahocorasick
  python_interpreter:
    package_system: python3.14
    python_path: /usr/bin/python3.14
  system: []

additional_build_steps:
  # prepend_galaxy:
  # - RUN /usr/bin/python3.14 -m pip install pyahocorasick
  prepend_final:
  # - RUN /usr/bin/python3.14 -m pip install pyahocorasick
  - ENV ANSIBLE_DEVEL_WARNING=false

images:
  base_image:
    name: registry.access.redhat.com/ubi10/ubi:latest

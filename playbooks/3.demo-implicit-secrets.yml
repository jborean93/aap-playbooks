# Demo 3 - secrets Ansible already knows about are masked without any playbook changes
#
#   ansible-playbook --vault-password-file playbooks/vault-password playbooks/3.demo-implicit-secrets.yml -v
#
- name: Secrets that are registered automatically
  hosts: localhost
  gather_facts: false
  vars:
    api_token: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      34653161323531393730353561653565643262363734373962616334393036646166663066396334
      6234333931383365643265396537393639343933653931370a313738616436363833643761333639
      65646661386162393066336561326432333961396263353963313064373061383837366337303865
      3330643938313832310a326166656665613131303238326431323433353766303337616232376632
      37373137373066376634306532653664643535373366623130333963366566306435

  tasks:
  - name: A vault encrypted value is masked as soon as it is decrypted
    debug:
      msg: 'Authorization: token {{ api_token }}'

  - name: The vault password used to decrypt it is registered as well
    command: cat {{ playbook_dir }}/vault-password
    changed_when: false

  - name: The password lookup registers the value it generates
    set_fact:
      db_password: "{{ lookup('password', '/dev/null length=24') }}"

  - name: Generated passwords never appear in output
    command: echo "psql postgresql://app:{{ db_password }}@db.example.com/app"
    changed_when: false

  - name: Dumping every variable for the host by accident leaks nothing
    debug:
      var: hostvars[inventory_hostname]

  - name: Everything above is still usable by its real value
    assert:
      that:
      - api_token.startswith('ghp_')
      - db_password | length == 24
      quiet: true

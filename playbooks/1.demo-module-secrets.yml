# Demo 1 - module no_log values and the register_secret / mask_secrets filters
#
#   ansible-playbook playbooks/1.demo-module-secrets.yml -v
#
# Run with -v so the full task results are shown. Every registered secret is
# replaced with $REDACTED$ in the output while the real value stays usable by
# later tasks.
- name: Module no_log values and the secret filters
  hosts: localhost
  gather_facts: false
  vars:
    demo_password: Sup3rSecretPassw0rd!

  tasks:
  - name: Call an API with a no_log option (url_password) and the password in the URL
    uri:
      url: https://httpbin.org/basic-auth/app/{{ demo_password }}
      url_username: app
      url_password: '{{ demo_password }}'
      return_content: true
    register: uri_result

  - name: The password is masked everywhere it appears in the result
    debug:
      var: uri_result

  - name: Later tasks still see the real value (no more VALUE_SPECIFIED_IN_NO_LOG_PARAMETER)
    assert:
      that:
      - demo_password in uri_result.url
      - uri_result.json.authenticated
      quiet: true

  - name: Register your own value as a secret with the register_secret filter
    set_fact:
      api_token: '{{ ("tok_" ~ 99999999 | random) | register_secret }}'

  - name: A registered secret is masked when a task prints it
    debug:
      msg: 'Authorization: Bearer {{ api_token }}'

  - name: When a command echoes it back
    command: >-
      echo "curl -H 'Authorization: Bearer {{ api_token }}' -u app:{{ demo_password }} https://httpbin.org"
    changed_when: false
    register: echo_result

  - name: Or when a task fails with it in the message
    fail:
      msg: 'Authentication failed for token {{ api_token }} and password {{ demo_password }}'
    ignore_errors: true

  - name: Output masking is cosmetic, the variables still hold the real values
    assert:
      that:
      - api_token in echo_result.stdout
      - demo_password in echo_result.stdout
      quiet: true

  - name: The mask_secrets filter rewrites a string for use outside of Ansible (files, external logs, ...)
    assert:
      that:
      - api_token not in (echo_result.stdout | mask_secrets)
      - "'***' in (echo_result.stdout | mask_secrets(mask_placeholder='***'))"
      quiet: true

# Demo 2 - the ssh connection plugin password is registered as a secret
#
#   ansible-playbook playbooks/2.demo-ssh-password.yml -v -k -c ssh
#
- name: Run playbook with ssh password provided through CLI
  hosts: localhost
  gather_facts: false

  tasks:
  - name: Displaying the ssh password value does not work
    debug:
      msg: Your password is {{ ansible_password }}

  - name: Passing the password on a command line, both cmd and stdout are masked
    command: echo "mysql -u app -p{{ ansible_password }} -h db.example.com"
    changed_when: false

  - name: Passing the password through the environment
    shell: env | grep ^DB_PASSWORD
    environment:
      DB_PASSWORD: '{{ ansible_password }}'
    changed_when: false

  - name: An error message that interpolates the password
    fail:
      msg: 'Could not connect to {{ ansible_user | default("unknown") }}@{{ ansible_host }} with password {{ ansible_password }}'
    ignore_errors: true
